name: Deploy FE to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
steps:
  - name: Write SSH key
    run: |
      mkdir -p ~/.ssh
      echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
      chmod 600 ~/.ssh/deploy_key

  - name: Deploy FE on DigitalOcean
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.VPS_HOST }}
      username: root
      key_path: ~/.ssh/deploy_key
      port: 22
      script: |
        cd /opt/SystematicLiteratureReviewSystem.FE
        git pull origin main
        npm install
        npm run build
        rm -rf /var/www/slr/*
        cp -r dist/* /var/www/slr/
        systemctl restart nginx