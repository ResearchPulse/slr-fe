name: Deploy FE to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Cài đặt Node.js trên máy ảo GitHub Runner để build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 2. Cài đặt dependencies và Build dự án ra thư mục dist
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # Connect GitHub Runner to your NetBird VPN network
      - name: Install and Connect NetBird VPN
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          sudo netbird up --setup-key ${{ secrets.NETBIRD_SETUP_KEY }}
          echo "Waiting 10 seconds for NetBird interface to initialize..."
          sleep 10
          sudo netbird status

      # 3. Copy các file đã build vào thư mục tạm trên VPS qua SCP (thư mục home của user luôn có quyền ghi)
      - name: Copy build files to VPS temporary directory via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/**"
          target: "slr-temp"
          strip_components: 1

      # 4. Deploy các file từ thư mục tạm sang thư mục Nginx bằng sudo và restart Nginx
      - name: Deploy files and Restart Nginx
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: VPS_PASSWORD
          script: |
            # Dọn dẹp thư mục Nginx (Sử dụng mật khẩu để xác thực sudo)
            echo "$VPS_PASSWORD" | sudo -S rm -rf /var/www/slr/*
            
            # Copy file từ thư mục tạm sang thư mục Nginx
            echo "$VPS_PASSWORD" | sudo -S cp -r ~/slr-temp/* /var/www/slr/
            
            # Dọn dẹp thư mục tạm
            rm -rf ~/slr-temp
            
            # Restart Nginx
            echo "$VPS_PASSWORD" | sudo -S systemctl restart nginx