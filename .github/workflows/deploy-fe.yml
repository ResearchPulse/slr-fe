name: Deploy FE to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy FE on DigitalOcean
        uses: garygrossgarten/github-action-ssh@release
        with:
          command: |
            cd /opt/SystematicLiteratureReviewSystem.FE
            git pull origin main
            npm install
            npm run build
            rm -rf /var/www/slr/*
            cp -r dist/* /var/www/slr/
            systemctl restart nginx
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}