name: Deploy FE to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy FE on DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: |
            ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/SystematicLiteratureReviewSystem.FE
            git pull origin main
            npm install
            npm run build
            rm -rf /var/www/slr/*
            cp -r dist/* /var/www/slr/
            systemctl restart nginx