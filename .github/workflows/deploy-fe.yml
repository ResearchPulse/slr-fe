name: CI/CD Build & Deploy Frontend (Docker & GHCR)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Build & Push Docker Image lên GitHub Container Registry (GHCR)
  build-and-push:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_BE_URL=${{ secrets.VITE_BE_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=fe
          cache-to: type=gha,mode=max,scope=fe

  # 2. Deploy lên Server qua SSH
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute deployment commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SERVER_USERNAME || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.VPS_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.SERVER_FE_PATH || secrets.VPS_PATH }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="~/slr-fe"
            fi

            echo "Navigating to $TARGET_DIR..."
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR" || exit 1

            echo "Pulling latest docker-compose.yml..."
            git pull origin main || true

            echo "Logging in to GHCR on server..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling latest Frontend image from GHCR..."
            docker compose pull || docker-compose pull

            echo "Starting Frontend container with Docker Compose..."
            docker compose up -d --remove-orphans || docker-compose up -d --remove-orphans

            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "Frontend deployment completed successfully!"
