name: Deploy FE to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Cài đặt Node.js trên máy ảo GitHub Runner để build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 2. Cài đặt dependencies và Build dự án ra thư mục dist
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # 3. Dọn dẹp thư mục cũ trên VPS trước khi copy file mới
      - name: Clear old files on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            rm -rf /var/www/slr/*

      # 4. Copy các file đã build từ thư mục dist/ sang VPS qua SCP
      - name: Copy build files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/**"
          target: "/var/www/slr"
          strip_components: 1

      # 5. Restart Nginx để cập nhật
      - name: Restart Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            sudo systemctl restart nginx