name: Deploy FE to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH key secret
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "VPS_SSH_KEY is EMPTY"
            exit 1
          else
            echo "VPS_SSH_KEY exists"
          fi

      - name: Deploy FE on DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/SystematicLiteratureReviewSystem.FE
            git fetch origin main
            git reset --hard origin/main

            rm -rf node_modules/.vite dist
            npm install
            npm run build

            rm -rf /var/www/slr/*
            cp -r dist/* /var/www/slr/

            systemctl restart nginx