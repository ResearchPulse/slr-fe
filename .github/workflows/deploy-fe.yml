name: Deploy FE to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-fe-production
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag (short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/slr-fe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/slr-fe:${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_BE_URL=${{ secrets.VITE_BE_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=fe
          cache-to: type=gha,mode=max,scope=fe

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Parse VPS SSH target
        id: vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          target="$VPS_HOST"
          target="${target#ssh }"

          if [[ "$target" == *@* ]]; then
            username="${target%@*}"
            host="${target#*@}"
          else
            username="root"
            host="$target"
          fi

          host="${host%% *}"

          if [ -z "$host" ]; then
            echo "VPS_HOST must be like: ssh root@1.2.3.4"
            exit 1
          fi

          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Detect SSH auth type
        id: ssh_auth
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          if printf '%s' "$VPS_PASSWORD" | grep -q "PRIVATE KEY"; then
            echo "type=key" >> "$GITHUB_OUTPUT"
          else
            echo "type=password" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VPS with password
        if: steps.ssh_auth.outputs.type == 'password'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        with:
          host: ${{ steps.vps.outputs.host }}
          username: ${{ steps.vps.outputs.username }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,VPS_PATH
          script: |
            VPS_PATH="${VPS_PATH:-/root/SystematicLiteratureReviewSystem.FE}"
            mkdir -p "$VPS_PATH"
            cd "$VPS_PATH"

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$DOCKERHUB_USERNAME/slr-fe:$IMAGE_TAG"

            docker stop slr-fe || true
            docker rm slr-fe || true

            docker run -d \
              --name slr-fe \
              -p 127.0.0.1:8081:80 \
              --restart unless-stopped \
              "$DOCKERHUB_USERNAME/slr-fe:$IMAGE_TAG"

            docker image prune -f
            docker ps -a

      - name: Deploy to VPS with private key
        if: steps.ssh_auth.outputs.type == 'key'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        with:
          host: ${{ steps.vps.outputs.host }}
          username: ${{ steps.vps.outputs.username }}
          key: ${{ secrets.VPS_PASSWORD }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,VPS_PATH
          script: |
            VPS_PATH="${VPS_PATH:-/root/SystematicLiteratureReviewSystem.FE}"
            mkdir -p "$VPS_PATH"
            cd "$VPS_PATH"

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$DOCKERHUB_USERNAME/slr-fe:$IMAGE_TAG"

            docker stop slr-fe || true
            docker rm slr-fe || true

            docker run -d \
              --name slr-fe \
              -p 127.0.0.1:8081:80 \
              --restart unless-stopped \
              "$DOCKERHUB_USERNAME/slr-fe:$IMAGE_TAG"

            docker image prune -f
            docker ps -a
