name: Deploy FE to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build FE
        run: npm run build

      # Connect GitHub Runner to your NetBird VPN network
      - name: Install and Connect NetBird VPN
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          sudo netbird up --setup-key ${{ secrets.NETBIRD_SETUP_KEY }}
          echo "Waiting 10 seconds for NetBird interface to initialize..."
          sleep 10
          sudo netbird status

      # Copy dist folder from GitHub Runner to VM
      - name: Copy FE build to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist"
          target: "/tmp/slr-fe"

      # Deploy static files to nginx folder
      - name: Deploy FE via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            sudo mkdir -p /var/www/slr

            sudo rm -rf /var/www/slr/*
            sudo cp -r /tmp/slr-fe/dist/* /var/www/slr/

            sudo chown -R www-data:www-data /var/www/slr
            sudo chmod -R 755 /var/www/slr

            sudo nginx -t
            sudo systemctl reload nginx

            rm -rf /tmp/slr-fe

            echo "FE deployed successfully"
