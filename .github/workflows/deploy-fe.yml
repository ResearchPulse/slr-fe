name: Deploy FE to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Docker Buildx to build image
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/slr-fe:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_BE_URL=${{ secrets.VITE_BE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # Connect GitHub Runner to your NetBird VPN network to access the VPS SSH
      - name: Install and Connect NetBird VPN
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          sudo netbird up --setup-key ${{ secrets.NETBIRD_SETUP_KEY }}
          echo "Waiting 10 seconds for NetBird interface to initialize..."
          sleep 10
          sudo netbird status

      # 4. Pull and Run the Docker container on VPS via SSH
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: VPS_PASSWORD,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            # Đăng nhập Docker Hub trên VPS
            echo "$VPS_PASSWORD" | sudo -S docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
            
            # Pull image mới nhất
            echo "$VPS_PASSWORD" | sudo -S docker pull "$DOCKERHUB_USERNAME/slr-fe:latest"
            
            # Stop và Xóa container cũ
            echo "$VPS_PASSWORD" | sudo -S docker stop slr-fe || true
            echo "$VPS_PASSWORD" | sudo -S docker rm slr-fe || true
            
            # Khởi chạy container mới trên cổng local 8081
            echo "$VPS_PASSWORD" | sudo -S docker run -d \
              --name slr-fe \
              -p 127.0.0.1:8081:80 \
              --restart unless-stopped \
              "$DOCKERHUB_USERNAME/slr-fe:latest"
            
            # Dọn dẹp các Docker image cũ không dùng để tiết kiệm ổ cứng VPS
            echo "$VPS_PASSWORD" | sudo -S docker image prune -f